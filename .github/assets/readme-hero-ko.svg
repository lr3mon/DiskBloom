<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">DiskBloom — macOS 로컬 디스크 공간 탐색기</title>
  <desc id="desc">사이드바와 다채로운 선버스트 디스크 지도를 갖춘 어두운 macOS 유틸리티 화면.</desc>

  <rect width="1400" height="560" rx="36" fill="#0B0E14"/>
  <path d="M0 425C248 357 396 487 645 431C888 376 1048 247 1400 302V560H0Z" fill="#11151D"/>
  <g fill="#FFFFFF" opacity=".035">
    <circle cx="64" cy="72" r="2"/><circle cx="104" cy="72" r="2"/><circle cx="144" cy="72" r="2"/>
    <circle cx="64" cy="112" r="2"/><circle cx="104" cy="112" r="2"/><circle cx="144" cy="112" r="2"/>
    <circle cx="1288" cy="468" r="2"/><circle cx="1328" cy="468" r="2"/><circle cx="1368" cy="468" r="2"/>
    <circle cx="1288" cy="508" r="2"/><circle cx="1328" cy="508" r="2"/><circle cx="1368" cy="508" r="2"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(88 82)">
    <rect width="92" height="92" rx="24" fill="#151A24" stroke="#FFFFFF" stroke-opacity=".09"/>
    <circle cx="46" cy="46" r="29" fill="none" stroke="#66D9B7" stroke-width="9" stroke-linecap="round" stroke-dasharray="56 128" transform="rotate(-72 46 46)"/>
    <circle cx="46" cy="46" r="18" fill="none" stroke="#6EA8FE" stroke-width="8" stroke-linecap="round" stroke-dasharray="42 72" transform="rotate(25 46 46)"/>
    <circle cx="46" cy="46" r="6" fill="#F1B45B"/>
  </g>

  <!-- Copy -->
  <text x="88" y="230" fill="#F4F6FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="750" letter-spacing="-2">DiskBloom</text>
  <text x="90" y="278" fill="#99A3B5" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', sans-serif" font-size="22">Mac의 저장 공간을 한눈에. 데이터는 로컬에.</text>
  <text x="90" y="316" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17">Native SwiftUI · Local-only analysis · Open source</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">
    <g transform="translate(88 359)">
      <rect width="160" height="42" rx="21" fill="#66D9B7" fill-opacity=".12" stroke="#66D9B7" stroke-opacity=".30"/>
      <circle cx="25" cy="21" r="5" fill="#66D9B7"/>
      <text x="40" y="27" fill="#B9F4E3">로컬 전용</text>
    </g>
    <g transform="translate(260 359)">
      <rect width="153" height="42" rx="21" fill="#6EA8FE" fill-opacity=".12" stroke="#6EA8FE" stroke-opacity=".30"/>
      <circle cx="25" cy="21" r="5" fill="#6EA8FE"/>
      <text x="40" y="27" fill="#C2D8FF">macOS 14+</text>
    </g>
    <g transform="translate(425 359)">
      <rect width="132" height="42" rx="21" fill="#F1B45B" fill-opacity=".12" stroke="#F1B45B" stroke-opacity=".30"/>
      <circle cx="25" cy="21" r="5" fill="#F1B45B"/>
      <text x="40" y="27" fill="#FFE0A8">MIT</text>
    </g>
  </g>

  <text x="90" y="475" fill="#667085" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">LOCAL-FIRST · OPEN SOURCE</text>

  <!-- App window -->
  <g transform="translate(710 58)">
    <rect width="612" height="444" rx="22" fill="#151A24" stroke="#FFFFFF" stroke-opacity=".10"/>
    <rect width="612" height="38" rx="22" fill="#1B2130"/>
    <rect y="20" width="612" height="18" fill="#1B2130"/>
    <circle cx="21" cy="19" r="5" fill="#F27F87"/><circle cx="39" cy="19" r="5" fill="#F1B45B"/><circle cx="57" cy="19" r="5" fill="#66D9B7"/>

    <!-- Sidebar -->
    <path d="M0 38H152V444H22C9.85 444 0 434.15 0 422Z" fill="#11151D"/>
    <g transform="translate(18 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <circle cx="17" cy="17" r="17" fill="#1B2130"/>
      <circle cx="17" cy="17" r="10" fill="none" stroke="#66D9B7" stroke-width="4" stroke-dasharray="17 46" transform="rotate(-60 17 17)"/>
      <text x="43" y="14" fill="#F4F6FA" font-size="12" font-weight="700">DiskBloom</text>
      <text x="43" y="27" fill="#667085" font-size="7" letter-spacing=".7">LOCAL EXPLORER</text>
    </g>
    <g transform="translate(12 117)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10">
      <rect width="128" height="38" rx="9" fill="#1B2130"/><circle cx="20" cy="19" r="5" fill="#66D9B7"/><text x="34" y="23" fill="#F4F6FA">전체 보기</text>
      <g transform="translate(0 44)"><rect width="128" height="38" rx="9" fill="none"/><circle cx="20" cy="19" r="5" fill="#6EA8FE"/><text x="34" y="23" fill="#99A3B5">Macintosh HD</text></g>
      <g transform="translate(0 88)"><rect width="128" height="38" rx="9" fill="none"/><circle cx="20" cy="19" r="5" fill="#F1B45B"/><text x="34" y="23" fill="#99A3B5">홈</text></g>
      <g transform="translate(0 132)"><rect width="128" height="38" rx="9" fill="none"/><circle cx="20" cy="19" r="5" fill="#F27F87"/><text x="34" y="23" fill="#99A3B5">다운로드</text></g>
    </g>
    <g transform="translate(21 397)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7" fill="#667085">
      <circle cx="4" cy="-2" r="3" fill="#66D9B7"/><text x="14" y="1">로컬 전용</text>
    </g>

    <!-- Main metrics -->
    <g transform="translate(174 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="0" y="13" fill="#F4F6FA" font-size="13" font-weight="700">공간 지도</text>
      <text x="0" y="31" fill="#667085" font-size="8">조각 클릭: 진입 · 중앙 클릭: 상위 이동</text>
      <g transform="translate(0 48)">
        <rect width="126" height="52" rx="11" fill="#1B2130"/><text x="12" y="18" fill="#667085" font-size="7">사용 공간</text><text x="12" y="39" fill="#F4F6FA" font-size="17" font-weight="700">604.6 GB</text>
      </g>
      <g transform="translate(136 48)">
        <rect width="126" height="52" rx="11" fill="#1B2130"/><text x="12" y="18" fill="#667085" font-size="7">파일</text><text x="12" y="39" fill="#F4F6FA" font-size="17" font-weight="700">4.7M</text>
      </g>
      <g transform="translate(272 48)">
        <rect width="126" height="52" rx="11" fill="#1B2130"/><text x="12" y="18" fill="#667085" font-size="7">폴더</text><text x="12" y="39" fill="#F4F6FA" font-size="17" font-weight="700">823K</text>
      </g>
    </g>

    <!-- Sunburst -->
    <g transform="translate(374 290) rotate(-90)">
      <circle r="111" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="24"/>
      <circle r="111" fill="none" stroke="#66D9B7" stroke-width="22" stroke-linecap="round" stroke-dasharray="245 452"/>
      <circle r="111" fill="none" stroke="#6EA8FE" stroke-width="22" stroke-linecap="round" stroke-dasharray="102 595" stroke-dashoffset="-258"/>
      <circle r="111" fill="none" stroke="#F1B45B" stroke-width="22" stroke-linecap="round" stroke-dasharray="78 619" stroke-dashoffset="-374"/>
      <circle r="84" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="21"/>
      <circle r="84" fill="none" stroke="#F27F87" stroke-width="19" stroke-linecap="round" stroke-dasharray="190 338"/>
      <circle r="84" fill="none" stroke="#AA8BFA" stroke-width="19" stroke-linecap="round" stroke-dasharray="116 412" stroke-dashoffset="-204"/>
      <circle r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".025" stroke-width="18"/>
      <circle r="58" fill="none" stroke="#58C7D4" stroke-width="16" stroke-linecap="round" stroke-dasharray="138 226"/>
      <circle r="58" fill="none" stroke="#A5D76E" stroke-width="16" stroke-linecap="round" stroke-dasharray="90 274" stroke-dashoffset="-154"/>
    </g>
    <g transform="translate(374 290)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text y="-2" fill="#F4F6FA" font-size="17" font-weight="700">604 GB</text>
      <text y="16" fill="#99A3B5" font-size="8">로컬 저장소</text>
    </g>
  </g>
</svg>
